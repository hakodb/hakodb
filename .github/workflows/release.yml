name: release

# Core library releases only. Satellites (cli, cloudserver, SDKs, bench,
# tauri) version independently and carry no workflows; FFI consumers pin
# these assets by tag: hakodb-<version>-<target>.<ext> + headers.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build cdylib (MSVC import lib is a release artifact)
        run: cargo build --release
      - name: Collect assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/hakodb.dll dist/
          Copy-Item target/release/hakodb.dll.lib dist/hakodb.lib
          Copy-Item include/hakodb.h dist/
          (Get-FileHash dist/hakodb.dll -Algorithm SHA256).Hash | Out-File dist/SHA256SUMS
          (Get-FileHash dist/hakodb.lib -Algorithm SHA256).Hash | Out-File dist/SHA256SUMS -Append
      - uses: actions/upload-artifact@v4
        with:
          name: hakodb-${{ github.ref_name }}-x86_64-pc-windows-msvc
          path: dist/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build cdylib + rlib
        run: cargo build --release
      - name: Collect assets
        run: |
          mkdir -p dist
          cp target/release/libhakodb.so target/release/libhakodb.rlib include/hakodb.h dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hakodb-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
      - name: Build cdylib for aarch64-linux-android (API 21)
        run: |
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export CC_aarch64_linux_android="$CLANG"
          export CXX_aarch64_linux_android="${CLANG}++"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG"
          cargo build --release --target aarch64-linux-android
      - name: Collect assets
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/libhakodb.so include/hakodb.h dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hakodb-${{ github.ref_name }}-aarch64-linux-android
          path: dist/

  publish:
    needs: [windows-msvc, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/**/*
