name: perf

on:
  pull_request:
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build FireLite cdylib
        run: cargo build --release
      - name: Build C++ benchmark harness
        run: g++ -O2 -std=c++17 -Iinclude benchmark.cpp -Ltarget/release -lfirelite -o benchmark
      - name: Run official benchmark (benchmark.cpp)
        run: LD_LIBRARY_PATH=target/release ./benchmark --docs=1000
      - name: Regression gate (Manual profile, relative invariants + smoke floors)
        # check_gate() in benchmark.cpp: Qry>=Cmp, Off/Cur within 2x,
        # Get>5xQry, Batch>=Single, plus 5-10x-headroom smoke floors.
        # Relative invariants are hardware-independent; smoke floors only
        # catch total breakage, so noisy CI runners don't flake.
        run: LD_LIBRARY_PATH=target/release ./benchmark --docs=1000 --gate
