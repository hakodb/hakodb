[package]
name = "firelite-fsync"
version = "0.6.20"
edition = "2021"

[lib]
name = "firelite_sync"  # This produces firelite_sync.dll / .so / .dylib
crate-type = ["cdylib"] # This makes it an FFI library

[dependencies]
# We point to the parent folder and force the feature on
firelite = { path = "..", features = ["net-sync"] }

# You might need to duplicate these so the wrapper links correctly
# tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }