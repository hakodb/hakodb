[package]
name = "hakodb"
version = "0.19.3"
edition = "2021"
authors = ["AbcDev Team"]
description = "Embedded & Cloud-native Document Engine"
license = "MIT"
repository = "https://github.com/hakodb/hakodb"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
# Test fixtures start from a Default config and override one or two fields;
# the struct-literal rewrite is noisier than the assignment. Off by policy.
field_reassign_with_default = "allow"

[features]
default = ["net-sync", "cloud-sync", "socket-sync", "compression"]
net-sync = ["dep:tokio", "dep:mdns-sd", "dep:gethostname", "dep:local-ip-address", "dep:socket2" ]
cloud-sync = ["dep:tokio", "dep:tokio-tungstenite", "dep:rustls", "dep:futures-util", "dep:rmp-serde"]
# TLS stays vendored-rustls with the SINGLE aws-lc provider (tungstenite 0.26
# forces rustls/aws_lc_rs, so our old extra `ring` was pure dead weight).
# native-tls was tried in 0.15.1 and reverted — openssl-sys needs system
# OpenSSL dev libs, breaking stock Linux containers + Android NDK (release
# red). ponytail: hermetic builds beat 0.5MB.
compression = ["dep:zstd"]
# Co-located instance sync over unix sockets (balancer use-case). Unix-only:
# tokio has no net::unix on Windows, so the module compiles out there and
# the feature is a silent no-op (Windows builds stay green).
socket-sync = ["dep:tokio"]


[dependencies]
memmap2 = "0.9"
crc32fast = "1"
serde = { version = "1", features=["derive", "rc"] }
serde_json = "1"
# Single-pass JSON writer (write_json): itoa already unified via
# serde_json — feature unification only, nothing new to download.
itoa = "1"
parking_lot = "0.12"
thiserror = "1"
rand = "0.8"
sha2 = "0.10"
chacha20poly1305 = "0.10"
hashbrown = { version = "0.14", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }
zstd = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time"], optional = true }
bincode = "1.3"
rayon = "1.8"
crossbeam-channel = "0.5"
mdns-sd = { version = "0.11", optional = true}
gethostname = { version = "0.5", optional = true }
local-ip-address = { version ="0.5", optional = true }
fxhash = "0.2.1"
socket2 = { version = "0.5", optional = true }
rmp-serde = {version = "1.3", optional = true }
# TLS: vendored rustls with the SINGLE ring provider. tungstenite 0.30
# selects no crypto provider itself (default-features=false), so unlike
# 0.26 (which forced aws_lc_rs) ring-only is possible — aws-lc-sys C++
# is gone from the tree and the binary. ponytail: hermetic kept, 0.9MB won.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"], optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
rand = "0.8"
bincode = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "read_path"
harness = false

[[bench]]
name = "write_path"
harness = false

[build-dependencies]
cbindgen = "0.28"

[workspace]
members = [
    ".",
]

# ponytail: line-tables-only keeps backtraces, cuts pdb bulk + link time on weak CPUs
[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
