[package]
name = "firelite"
version = "0.6.63"
edition = "2021"
authors = ["AbcDev Team"]
description = "Embedded & Cloud-native Document Engine"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
tauri-gateway = ["dep:tauri", "dep:tokio", "dep:rmp-serde", "dep:rmpv" ]
net-sync = ["dep:tokio", "dep:mdns-sd", "dep:gethostname", "dep:local-ip-address", "dep:socket2" ]
cloud-sync = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:reqwest",
    "dep:http",
    "dep:bincode",
    "dep:futures",
]


[dependencies]
memmap2 = "0.9"
crc32fast = "1"
serde = { version = "1", features=["derive", "rc"] }
serde_json = "1"
parking_lot = "0.12"
thiserror = "1"
rand = "0.8"
sha2 = "0.10"
chacha20poly1305 = "0.10"
hashbrown = { version = "0.14", features = ["serde"] }
smallvec = "1"
zstd = "0.13"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time"], optional = true }
bincode = "1.3"
rayon = "1.8"
crossbeam-channel = "0.5"
tauri = { version = "2", optional = true }
mdns-sd = { version = "0.11", optional = true}
gethostname = { version = "0.5", optional = true }
local-ip-address = { version ="0.5", optional = true }
fxhash = "0.2.1"
socket2 = { version = "0.5", optional = true }
rmp-serde = {version = "1.3", optional = true }
rmpv = { version = "1.0", features = ["with-serde"], optional = true }
resolver = { "2", optional = true }
tokio-tungstenite = { version = "0.21", features = ["native-tls"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
http = { version = "1.1", optional = true }
bincode = { version = "1.3", optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"

[build-dependencies]
cbindgen = "0.28"

[[bench]]
name = "engine_bench"
harness = false

[workspace]
members = [
    ".",          
    "cli",  
    "fsync",
    "firelite_controller"
]
