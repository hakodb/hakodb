[package]
name = "firelite"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
tauri-gateway = ["dep:tauri"]

[dependencies]
memmap2 = "0.9"
crc32fast = "1"
serde = { version = "1", features=["derive"] }
serde_json = "1"
parking_lot = "0.12"
thiserror = "1"
rand = "0.8"
sha2 = "0.10"
chacha20poly1305 = "0.10"
libc = "0.2"
tauri = { version = "2", optional = true }

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
cbindgen = "0.28"

[[bench]]
name = "engine_bench"
harness = false
