[package]
name = "firelite"
version = "0.6.14"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
tauri-gateway = ["dep:tauri", "dep:tokio"]
net-sync = ["dep:tokio", "dep:mdns-sd", "dep:gethostname", "dep:local-ip-address" ]


[dependencies]
memmap2 = "0.9"
crc32fast = "1"
serde = { version = "1", features=["derive", "rc"] }
serde_json = "1"
parking_lot = "0.12"
thiserror = "1"
rand = "0.8"
sha2 = "0.10"
chacha20poly1305 = "0.10"
libc = "0.2"
tauri = { version = "2", optional = true }
hashbrown = { version = "0.14", features = ["serde"] }
smallvec = "1"
zstd = "0.13"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time"], optional = true }
bincode = "1.3"
mdns-sd = { version = "0.11", optional = true}
gethostname = { version = "0.5", optional = true }
local-ip-address = { version ="0.5", optional = true }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
rand_distr = "0.6.0"

[build-dependencies]
cbindgen = "0.28"

[[bench]]
name = "engine_bench"
harness = false
