language = "C"
braces = "SameLine"
line_length = 100
tab_width = 4
edition = "2021"
header = "/* Auto-generated by cbindgen. Do not edit manually. */"
include_guard = "FIRELITE_H"
pragma_once = true
autogen_define_symbol = "FIRELITE_BINDINGS_H"

[parse]
parse_deps = false

[export]
prefix = "FL_"

[fn]
rename_args = "snake_case"

[struct]
rename_fields = "snake_case"
